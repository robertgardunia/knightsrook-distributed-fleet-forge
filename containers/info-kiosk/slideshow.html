<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Racing Simulator — Info</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000814; overflow: hidden; width: 100vw; height: 100vh; }
    #slide {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity 0.6s ease;
    }
    #slide.fade { opacity: 0; }
  </style>
</head>
<body>
  <img id="slide" alt="">
  <script>
    var SLIDES = [
      '/slides/info-build-racer.png',
      '/slides/info-controls.png',
      '/slides/info-cornering.png',
      '/slides/info-scan-qr.png'
    ];

    var img     = document.getElementById('slide');
    var current = Math.floor(Math.random() * SLIDES.length);

    function showSlide(idx) {
      img.classList.add('fade');
      setTimeout(function () {
        img.src = SLIDES[idx];
        img.classList.remove('fade');
      }, 600);
    }

    function scheduleNext() {
      var delay = 8000 + Math.random() * 12000; // 8–20 s
      setTimeout(function () {
        current = (current + 1) % SLIDES.length;
        showSlide(current);
        scheduleNext();
      }, delay);
    }

    // Boot
    img.src = SLIDES[current];
    scheduleNext();
  </script>
</body>
</html>
