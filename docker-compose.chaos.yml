    environment: { AGENT_ID: s3-game-2, AGENT_NAME: KG2, AGENT_ROLE: game-kiosk, AGENT_PARENT: s3-controller, HOMEBASE_URL: "http://s3-controller:5021"  }
    ports: ["18302:8080"]
    networks: [station-s3-net]
    depends_on: [s3-controller]
