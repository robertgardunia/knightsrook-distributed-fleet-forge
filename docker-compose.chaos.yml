# Chaos lab — 1 homebase + 4 stations × (1 controller + 4 game kiosks + 2 info kiosks) = 29 nodes
#
# ALL servers are real containers. No host.docker.internal shortcuts.
#
# Network topology:
#   fleet-net          — homebase ↔ station-controllers ↔ chaos-proxy
#   station-sN-net     — sN-controller relay ↔ sN kiosks only; no direct route to homebase
#
# Kiosks connect to their station-controller relay, never homebase directly.
# Toxiproxy control API on :8474 for the gremlin driver.
# Homebase fleet socket published on :5025 for the dashboard client.
#
# Kiosk HTTP ports published to host for live iframe display:
#   sN-game-K  →  18N0K  (e.g. s1-game-1 → 18101, s2-game-3 → 18203)
#   sN-info-K  →  18N5K  (e.g. s1-info-1 → 18151, s3-info-2 → 18352)

services:

  # ── Homebase ──────────────────────────────────────────────────────────────
  homebase:
    container_name: homebase
    build:
      context: .
      dockerfile: containers/homebase/Dockerfile
    environment:
      PORT: "5020"
      NODE_ENV: production
      USE_MOCK: "false"
      TOXIPROXY_URL: "http://chaos-proxy:8474"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      LL_ENDPOINT: "${LL_ENDPOINT}"
      LL_KEY: "${LL_KEY}"
      LL_SECRET: "${LL_SECRET}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - homebase-data:/app/data
    ports:
      - "5025:5020"
    networks: [fleet-net]
    restart: unless-stopped

  # ── Station S1 ────────────────────────────────────────────────────────────
  s1-controller:
    container_name: s1-controller
    build: ./containers/station-controller
    environment:
      AGENT_ID: s1-controller
      AGENT_NAME: S1
      HOMEBASE_URL: http://chaos-proxy:21001
      RELAY_PORT: "5021"
    volumes:
      - s1-controller-data:/app/data
    networks: [fleet-net, station-s1-net]
    depends_on: [homebase, chaos-proxy]
    restart: unless-stopped

  s1-game-1:
    container_name: s1-game-1
    build: ./containers/game-kiosk
    environment: { AGENT_ID: s1-game-1, AGENT_NAME: KG1, AGENT_ROLE: game-kiosk, AGENT_PARENT: s1-controller, HOMEBASE_URL: "http://s1-controller:5021"  }
    ports: ["18101:8080"]
    networks: [station-s1-net]
    depends_on: [s1-controller]
    restart: unless-stopped

  s1-game-2:
    container_name: s1-game-2
    build: ./containers/game-kiosk
    environment: { AGENT_ID: s1-game-2, AGENT_NAME: KG2, AGENT_ROLE: game-kiosk, AGENT_PARENT: s1-controller, HOMEBASE_URL: "http://s1-controller:5021"  }
    ports: ["18102:8080"]
    networks: [station-s1-net]
    depends_on: [s1-controller]
    restart: unless-stopped

  s1-game-3:
    container_name: s1-game-3
    build: ./containers/game-kiosk
    environment: { AGENT_ID: s1-game-3, AGENT_NAME: KG3, AGENT_ROLE: game-kiosk, AGENT_PARENT: s1-controller, HOMEBASE_URL: "http://s1-controller:5021"  }
    ports: ["18103:8080"]
    networks: [station-s1-net]
    depends_on: [s1-controller]
    restart: unless-stopped

  s1-game-4:
    container_name: s1-game-4
    build: ./containers/game-kiosk
    environment: { AGENT_ID: s1-game-4, AGENT_NAME: KG4, AGENT_ROLE: game-kiosk, AGENT_PARENT: s1-controller, HOMEBASE_URL: "http://s1-controller:5021"  }
    ports: ["18104:8080"]
    networks: [station-s1-net]
    depends_on: [s1-controller]
    restart: unless-stopped

  s1-info-1:
    container_name: s1-info-1
    build:
      context: .
      dockerfile: containers/info-kiosk/Dockerfile
    environment: { AGENT_ID: s1-info-1, AGENT_NAME: KI1, AGENT_ROLE: info-kiosk, AGENT_PARENT: s1-controller, HOMEBASE_URL: "http://s1-controller:5021"  }
    ports: ["18151:8080"]
    networks: [station-s1-net]
    depends_on: [s1-controller]
    restart: unless-stopped

  s1-info-2:
    container_name: s1-info-2
