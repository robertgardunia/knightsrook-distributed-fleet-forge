      context: .
      dockerfile: containers/info-kiosk/Dockerfile
    environment: { AGENT_ID: s4-info-1, AGENT_NAME: KI1, AGENT_ROLE: info-kiosk, AGENT_PARENT: s4-controller, HOMEBASE_URL: "http://s4-controller:5021"  }
    ports: ["18451:8080"]
    networks: [station-s4-net]
    depends_on: [s4-controller]
    restart: unless-stopped

  s4-info-2:
    container_name: s4-info-2
    build:
      context: .
      dockerfile: containers/info-kiosk/Dockerfile
    environment: { AGENT_ID: s4-info-2, AGENT_NAME: KI2, AGENT_ROLE: info-kiosk, AGENT_PARENT: s4-controller, HOMEBASE_URL: "http://s4-controller:5021"  }
    ports: ["18452:8080"]
    networks: [station-s4-net]
    depends_on: [s4-controller]
    restart: unless-stopped

  # ── Chaos Proxy (Toxiproxy) ───────────────────────────────────────────────
  chaos-proxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    command: ["-host", "0.0.0.0", "-config", "/etc/toxiproxy/config.json"]
    volumes:
      - ./config/toxiproxy.json:/etc/toxiproxy/config.json:ro
    ports:
      - "8474:8474"
    networks: [fleet-net, station-s1-net, station-s2-net, station-s3-net, station-s4-net]
    restart: unless-stopped

  # ── Chaos Agent (Haiku gremlin) ───────────────────────────────────────────
  chaos-agent:
    container_name: chaos-agent
    build: ./containers/chaos-agent
    environment:
      FLEET_URL:         "http://homebase:5020"
      TOXIPROXY_URL:     "http://chaos-proxy:8474"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      MIN_INTERVAL_MS:   "30000"
      MAX_INTERVAL_MS:   "120000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [fleet-net]
    depends_on: [homebase, chaos-proxy]
    restart: unless-stopped

networks:
  fleet-net:
  station-s1-net:
  station-s2-net:
  station-s3-net:
  station-s4-net:

volumes:
  homebase-data:
  s1-controller-data:
  s2-controller-data:
  s3-controller-data:
  s4-controller-data:
