    environment: { AGENT_ID: s4-game-2, AGENT_NAME: KG2, AGENT_ROLE: game-kiosk, AGENT_PARENT: s4-controller, HOMEBASE_URL: "http://s4-controller:5021"  }
    ports: ["18402:8080"]
