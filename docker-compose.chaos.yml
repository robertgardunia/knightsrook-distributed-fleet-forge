# Chaos lab — 1 homebase, 4 stations × (1 controller + 4 game kiosks + 2 info kiosks) = 29 nodes
#
# Network topology mirrors production:
#   fleet-net          — homebase ↔ station-controllers (+ chaos-proxy)
#   station-sN-net     — sN-controller relay ↔ sN kiosks only; no direct route to homebase
#
# Kiosks connect to their station-controller relay, never homebase directly.
# Toxiproxy control API on :8474 for the gremlin driver.

services:

  # ── Homebase ──────────────────────────────────────────────────────────────
  homebase:
    build: .
    ports:
      - "5020:5020"
    environment:
      NODE_ENV: production
      PORT: "5020"
      USE_MOCK: "false"
    networks: [fleet-net]
    restart: unless-stopped

  # ── Station S1 ────────────────────────────────────────────────────────────
  s1-controller:
    build: ./containers/station-controller
    environment:
      AGENT_ID: station-s1
      AGENT_NAME: S1
      HOMEBASE_URL: http://homebase:5020
      RELAY_PORT: "5021"
    networks: [fleet-net, station-s1-net]
    depends_on: [homebase]
    restart: unless-stopped

  s1-game-1:
    build: ./containers/fleet-agent
    environment: { AGENT_ID: s1-game-1, AGENT_NAME: KG1, AGENT_ROLE: game-kiosk, AGENT_PARENT: station-s1, HOMEBASE_URL: "http://s1-controller:5021" }
    networks: [station-s1-net]
    depends_on: [s1-controller]
    restart: unless-stopped

  s1-game-2:
    build: ./containers/fleet-agent
    environment: { AGENT_ID: s1-game-2, AGENT_NAME: KG2, AGENT_ROLE: game-kiosk, AGENT_PARENT: station-s1, HOMEBASE_URL: "http://s1-controller:5021" }
    networks: [station-s1-net]
    depends_on: [s1-controller]
    restart: unless-stopped

  s1-game-3:
    build: ./containers/fleet-agent
    environment: { AGENT_ID: s1-game-3, AGENT_NAME: KG3, AGENT_ROLE: game-kiosk, AGENT_PARENT: station-s1, HOMEBASE_URL: "http://s1-controller:5021" }
    networks: [station-s1-net]
    depends_on: [s1-controller]
    restart: unless-stopped

  s1-game-4:
    build: ./containers/fleet-agent
    environment: { AGENT_ID: s1-game-4, AGENT_NAME: KG4, AGENT_ROLE: game-kiosk, AGENT_PARENT: station-s1, HOMEBASE_URL: "http://s1-controller:5021" }
    networks: [station-s1-net]
    depends_on: [s1-controller]
    restart: unless-stopped

  s1-info-1:
    build: ./containers/fleet-agent
    environment: { AGENT_ID: s1-info-1, AGENT_NAME: KI1, AGENT_ROLE: info-kiosk, AGENT_PARENT: station-s1, HOMEBASE_URL: "http://s1-controller:5021" }
    networks: [station-s1-net]
    depends_on: [s1-controller]
    restart: unless-stopped

  s1-info-2:
    build: ./containers/fleet-agent
    environment: { AGENT_ID: s1-info-2, AGENT_NAME: KI2, AGENT_ROLE: info-kiosk, AGENT_PARENT: station-s1, HOMEBASE_URL: "http://s1-controller:5021" }
