    build: ./containers/game-kiosk
    environment: { AGENT_ID: s2-game-3, AGENT_NAME: KG3, AGENT_ROLE: game-kiosk, AGENT_PARENT: s2-controller, HOMEBASE_URL: "http://s2-controller:5021"  }
